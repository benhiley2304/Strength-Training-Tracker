<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0e"><title>Cycle Training Log</title><style>:root{--b:#090b0e;--c:#11161b;--l:#27303a;--t:#f5f7f9;--m:#84909b;--g:#baff69;--x:#65e8ef;--r:#ff657c;--a:#ffc45a}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.app{max-width:1100px;margin:auto;padding:20px 16px 90px}.top,.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{height:48px;margin-bottom:20px}.logo{font-weight:900;letter-spacing:.15em;text-transform:uppercase}.logo:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g);margin-right:9px}.nav{display:flex;gap:4px}.nav button,.btn{border:0;border-radius:9px;background:transparent;color:var(--m);padding:9px 12px;cursor:pointer;font-weight:800}.nav button.on,.nav button:hover,.btn:hover{background:#171d23;color:var(--t)}.btn.go{background:var(--g);color:#0a1005}.view{display:none}.view.on{display:block}.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-bottom:22px}.slot{height:40px;border:1px solid var(--l);background:var(--c);color:var(--m);border-radius:9px;cursor:pointer;font-weight:900}.slot.on{border-color:var(--g);color:var(--t)}.slot.done{color:var(--g)}h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.06em;margin:0}.sub{color:var(--m);margin:5px 0}.head{align-items:flex-end;margin-bottom:15px}.actions{display:flex;gap:5px}.progress{height:3px;background:#171d23;margin-bottom:10px}.progress i{display:block;height:100%;background:var(--g)}.list{display:grid;gap:7px}.ex{border:1px solid var(--l);background:var(--c);border-radius:13px;overflow:hidden}.exhead{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:12px}.cat{font-size:10px;color:var(--x);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.ex h3{margin:3px 0 0;font-size:14px}.target{font-size:12px;color:#bdc7d0;font-weight:700}.add{width:28px;height:28px;border:1px solid var(--l);border-radius:8px;background:#090c0f;color:var(--m);cursor:pointer}.sets{border-top:1px solid var(--l);padding:6px 12px 10px}.set{display:grid;grid-template-columns:24px 1fr 1fr 1fr 55px 25px;gap:6px;align-items:center;margin-top:6px}.field{width:100%;min-width:0;border:1px solid var(--l);background:#090c0f;color:var(--t);border-radius:8px;padding:8px}.tick{width:25px;height:25px;border:1px solid var(--l);background:transparent;border-radius:7px;color:#091004}.tick.on{background:var(--g)}.rm{border:0;background:transparent;color:#59636d}.below{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.box{border:1px solid var(--l);background:var(--c);border-radius:13px;padding:13px}.box h3{font-size:12px;margin:0 0 9px}.notes{width:100%;min-height:65px;border:0;background:transparent;color:var(--t);outline:0;resize:vertical}.choices{display:flex;gap:6px;flex-wrap:wrap}.choice{border:1px solid var(--l);background:#090c0f;color:var(--m);padding:7px 9px;border-radius:99px;font-size:11px}.choice.on{border-color:#698548;color:var(--g)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid var(--l);background:var(--c);border-radius:13px;padding:15px;text-align:left;color:var(--t);cursor:pointer}.card small{color:var(--m)}.card h3{margin:18px 0 3px}.card p{color:var(--m);font-size:11px}.historyTop{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:14px}.controls{display:flex;gap:6px}.select{border:1px solid var(--l);background:var(--c);color:var(--t);padding:9px;border-radius:9px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.metric,.chart,.history{border:1px solid var(--l);background:var(--c);border-radius:13px}.metric{padding:13px}.metric small{color:var(--m)}.metric strong{display:block;font-size:22px;margin-top:4px}.chart{height:250px;padding:10px;margin-bottom:8px}.chart svg{width:100%;height:100%}.row{display:grid;grid-template-columns:100px 1fr 90px 70px;gap:8px;padding:10px 12px;border-top:1px solid var(--l)}.row:first-child{border:0}.green{color:var(--g)}.empty{text-align:center;color:var(--m);padding:30px}.data{text-align:center;margin-top:15px}@media(max-width:700px){.nav{display:none}.strip{grid-template-columns:repeat(6,1fr)}.head{display:block}.actions{margin-top:12px}.exhead{grid-template-columns:1fr auto}.target{grid-column:1}.add{grid-column:2;grid-row:1/3}.set{grid-template-columns:20px 1fr 1fr 40px 24px}.rpe{display:none}.below{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.historyTop{display:block}.controls{margin-top:10px;flex-wrap:wrap}.row{grid-template-columns:75px 1fr 65px}.row .rpe{display:none}}</style></head><body><div class="app"><header class="top"><div class="logo">Cycle</div><nav class="nav"><button data-v="workout" class="on">Workout</button><button data-v="cycle">Cycle</button><button data-v="history">History</button></nav><button class="btn" id="exportTop">Export</button></header><section id="workout" class="view on"><div id="strip" class="strip"></div><div class="head"><div><small id="eyebrow" class="cat"></small><h1 id="name"></h1><p id="focus" class="sub"></p></div><div class="actions"><button class="btn" id="prev">←</button><button class="btn" id="next">→</button><button class="btn go" id="saveWorkout">Save</button></div></div><div class="progress"><i id="progress"></i></div><div id="exerciseList" class="list"></div><div class="below"><div id="conditioningBox" class="box"><h3>Conditioning</h3><div id="choices" class="choices"></div></div><div class="box"><h3>Notes</h3><textarea id="notes" class="notes"></textarea></div></div></section><section id="cycle" class="view"><div class="head"><h1>Cycle</h1><button class="btn" id="resetCycle">Reset</button></div><div id="cycleGrid" class="grid"></div></section><section id="history" class="view"><div class="historyTop"><h1>History</h1><div class="controls"><select id="liftSelect" class="select"></select><label class="select">BW <input id="bodyweight" class="field" style="width:70px" type="number" step=".1"> kg</label></div></div><div class="metrics"><div class="metric"><small>Best e1RM</small><strong id="bestE1">—</strong></div><div class="metric"><small>Latest</small><strong id="latestE1">—</strong></div><div class="metric"><small>Change</small><strong id="changeE1">—</strong></div></div><div id="chart" class="chart"></div><div id="historyList" class="history"></div><div class="data"><button class="btn" id="exportBtn">Export JSON</button><label class="btn" for="importFile">Import JSON</label><input hidden id="importFile" type="file"></div></section></div><script>const W=[[1,'Heavy Upper A','Upper A · Heavy','Bench + row',null,[['H press','Bench press','1×3–5 + optional 1×5–7',1],['H pull','Barbell row','2×5–7',1],['V press','High-incline DB press','1–2×6–10',1],['V pull','Weighted pull-up','1–2×5–8',2],['Biceps','Incline DB / EZ curl','2×8–12'],['Triceps','Overhead cable extension','2×8–12'],['Delts','Cable lateral raise','2×12–20'],['Rear delts','Reverse pec deck','2×12–20']]],[2,'Medium Lower A','Lower A · Medium','Squat + RDL + reverse lunge',['Easy bike','None'],[['Squat','Back squat','1×5–7 + optional 1×7–9',1],['Hinge','Romanian deadlift','1–2×7–10',1],['Unilateral','DB reverse lunge','1–2×8–12/leg'],['Hamstrings','Leg curl','2×10–15'],['Quads','Leg extension','1×12–20'],['Calves','Standing calf raise','2–3×10–20'],['Shins','Tibialis raise','2×15–25'],['Abs','Cable crunch','3×8–15'],['Obliques','Pallof press','2×10–15/side']]],[3,'Light Upper B','Upper B · Light','OHP + pull-ups',null,[['V press','Barbell OHP','1–2×8–10',1],['V pull','Weighted pull-up','1–2×8–10',2],['H press','Flat DB press / dip','1–2×10–15',2],['H pull','Supported / cable row','2×12–15'],['Biceps','Hammer curl','2×12–15'],['Triceps','Rope pushdown','2×12–20'],['Delts','Cable lateral raise','3×15–25'],['Rear delts','Reverse pec deck','2–3×15–25'],['Shoulders','External rotation + Y-raise','2 rounds']]],[4,'Heavy Lower B','Lower B · Heavy','Deadlift + front squat',['Easy bike/walk','None'],[['Hinge','Conventional deadlift','1×1–3 + 1×3–5',1],['Squat','Front squat','1–2×4–6',1],['Hamstrings','Leg curl','2×8–12'],['Quads','Leg extension','1–2×10–15'],['Soleus','Seated calf raise','2–3×10–20'],['Shins','Tibialis raise','2×15–25'],['Abs','Hanging knee raise','2×8–12'],['Obliques','Side plank','2×30–45s/side']]],[5,'Medium Upper A','Upper A · Medium','Bench + row volume',null,[['H press','Bench press','1×5–7 + optional 1×7–9',1],['H pull','Barbell row','2×6–8',1],['V press','High-incline DB press','1–2×8–12',1],['V pull','Weighted pull-up','1–2×6–10',2],['Biceps','Curl','2×10–15'],['Triceps','Overhead extension','2×10–15'],['Delts','Lateral raise','2×12–20'],['Rear delts','Reverse pec deck','2×12–20']]],[6,'Light Lower A','Lower A · Light','Quad growth',['Bike + ropes','Zone 2','None'],[['Unilateral','Heel-elevated Bulgarian','3×10–15/leg'],['Quads','Leg extension','3×12–20'],['Hamstrings','Leg curl','3×10–15'],['Posterior','Reverse hyper / back extension','2×12–20'],['Hips','Hip adduction','2×10–15'],['Hips','Hip abduction','2×12–20'],['Calves','Standing calf raise','3×12–20'],['Shins','Tibialis raise','2–3×15–30'],['Abs','Ab wheel','3×6–12'],['Obliques','Copenhagen plank','2×20–40s/side']]],[7,'Heavy Upper B','Upper B · Heavy','OHP + weighted pull-up',null,[['V press','Barbell OHP','1×3–5 + optional 1×5–7',1],['V pull','Weighted pull-up','2×3–6',2],['H press','Weighted dip / DB press','1–2×6–10',2],['H pull','Supported / cable row','2×8–10'],['Biceps','Hammer / preacher curl','2×8–12'],['Triceps','Rope pushdown','2×10–15'],['Delts','Lateral raise','2×12–20'],['Rear delts','Reverse pec deck','2×12–20']]],[8,'Medium Lower B','Lower B · Medium','Deadlift + front squat',['Easy bike','Easy row if fresh','None'],[['Hinge','Conventional deadlift','1×3–5 + optional 1×5–7',1],['Squat','Front squat','2×6–8',1],['Hamstrings','Leg curl','2×10–15'],['Quads','Leg extension','2×12–20'],['Soleus','Seated calf raise','2–3×10–20'],['Hips','Adduction / abduction','2×10–20'],['Abs','Decline / cable crunch','3×8–15'],['Obliques','Side plank','2×30–45s/side']]],[9,'Light Upper A','Upper A · Light','Bench + row volume',null,[['H press','Bench press','1–2×8–10',1],['H pull','Barbell row','2×8–10',1],['V press','Incline DB press','1–2×10–15',1],['V pull','Pull-up / pulldown','1–2×8–12',2],['Biceps','Curl','2×12–15'],['Triceps','Cable extension','2×12–20'],['Delts','Lateral raise','3×15–25'],['Rear delts','Reverse pec deck','2–3×15–25']]],[10,'Heavy Lower A','Lower A · Heavy','Squat + RDL',['Easy bike/walk','None'],[['Squat','Back squat','1×3–5 + optional 1×4–6',1],['Hinge','Romanian deadlift','1–2×5–8',1],['Unilateral','Reverse lunge · optional','1×8–10/leg'],['Hamstrings','Leg curl','2×8–12'],['Calves','Standing calf raise','2–3×8–15'],['Abs','Hanging leg raise','2×8–12'],['Obliques','Pallof press','2×10–15/side']]],[11,'Medium Upper B','Upper B · Medium','OHP + pull-up volume',null,[['V press','Barbell OHP','1×5–7 + optional 1×7–9',1],['V pull','Weighted pull-up','2×5–8',2],['H press','Weighted dip / DB press','1–2×8–12',2],['H pull','Supported / cable row','2×10–12'],['Biceps','Curl','2×10–15'],['Triceps','Pushdown / extension','2×10–15'],['Delts','Lateral raise','2–3×12–20'],['Rear delts','Reverse pec deck','2×12–20']]],[12,'Light Lower B','Lower B · Light','Front squat + athletic legs',['Bike + ropes','Rower + ropes','Wall balls + ropes','Zone 2','None'],[['Squat','Front squat','2×8–10',1],['Hinge','Technique deadlift · optional','1–2×3–5',1],['Unilateral','Walking / reverse lunge','2×10–16 steps'],['Hamstrings','Leg curl','3×10–15'],['Quads','Leg extension','2–3×12–20'],['Posterior','Reverse hyper / extension','2×12–20'],['Soleus','Seated calf raise','3×12–25'],['Shins','Tibialis raise','2–3×15–30'],['Hips','Adduction / abduction','2×12–20'],['Abs','Cable crunch','3×8–15'],['Obliques','Suitcase carry','2×20–40m/side']]]];const K='cycleLogV1';let S=JSON.parse(localStorage.getItem(K)||'null')||{cur:1,done:{},draft:{},notes:{},choice:{},history:[],bw:88};let cur=S.cur;const $=id=>document.getElementById(id),save=()=>{S.cur=cur;localStorage.setItem(K,JSON.stringify(S));renderStrip();renderCycle()},w=()=>W[cur-1],draft=i=>S.draft[cur+'-'+i]||(S.draft[cur+'-'+i]=[{kg:'',reps:'',rpe:'',done:false}]);function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));document.querySelectorAll('[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===v));if(v==='history')renderHistory()}function openW(n){cur=n;save();renderWorkout();show('workout')}function renderStrip(){$('strip').innerHTML=W.map(x=>`<button class="slot ${cur===x[0]?'on':''} ${S.done[x[0]]?'done':''}" onclick="openW(${x[0]})">${S.done[x[0]]?'✓':x[0]}</button>`).join('')}function renderCycle(){$('cycleGrid').innerHTML=W.map(x=>`<button class="card" onclick="openW(${x[0]})"><small>${x[0]} · ${x[2]}</small><h3>${x[1]}</h3><p>${x[3]}</p></button>`).join('')}function e1(e,s){let q=+s.kg+(e[3]===2?+S.bw:0),z=+s.reps<=1?q:q*(1+s.reps/30);return e[3]===2?z-S.bw:z}function row(i,j,s){return`<div class="set"><small>${j+1}</small><input class="field" type="number" step=".5" value="${s.kg}" placeholder="kg" oninput="edit(${i},${j},'kg',this.value)"><input class="field" type="number" value="${s.reps}" placeholder="reps" oninput="edit(${i},${j},'reps',this.value)"><input class="field rpe" type="number" step=".5" value="${s.rpe}" placeholder="RPE" oninput="edit(${i},${j},'rpe',this.value)"><small>${w()[5][i][3]&&s.kg&&s.reps?Math.round(e1(w()[5][i],s))+' e1':''}</small><button class="tick ${s.done?'on':''}" onclick="tick(${i},${j})">${s.done?'✓':''}</button><button class="rm" onclick="rm(${i},${j})">×</button></div>`}function renderWorkout(){let x=w();$('eyebrow').textContent='Session '+x[0]+' · '+x[2];$('name').textContent=x[1];$('focus').textContent=x[3];$('notes').value=S.notes[cur]||'';$('exerciseList').innerHTML=x[5].map((e,i)=>`<div class="ex"><div class="exhead"><div><div class="cat">${e[0]}</div><h3>${e[1]}</h3></div><div class="target">${e[2]}</div><button class="add" onclick="add(${i})">+</button></div><div class="sets">${draft(i).map((s,j)=>row(i,j,s)).join('')}</div></div>`).join('');if(x[4]){$('conditioningBox').style.display='block';$('choices').innerHTML=x[4].map((c,i)=>`<button class="choice ${S.choice[cur]===i?'on':''}" onclick="choose(${i})">${c}</button>`).join('')}else $('conditioningBox').style.display='none';prog()}function add(i){draft(i).push({kg:'',reps:'',rpe:'',done:false});save();renderWorkout()}function edit(i,j,k,v){draft(i)[j][k]=v;localStorage.setItem(K,JSON.stringify(S));if(k!=='rpe')renderWorkout()}function tick(i,j){draft(i)[j].done=!draft(i)[j].done;save();renderWorkout()}function rm(i,j){draft(i).splice(j,1);if(!draft(i).length)add(i);else{save();renderWorkout()}}function choose(i){S.choice[cur]=i;save();renderWorkout()}function prog(){let a=w()[5].flatMap((_,i)=>draft(i));$('progress').style.width=(a.filter(s=>s.done).length/a.length*100)+'%'}function saveSession(){let x=w(),sets=[];x[5].forEach((e,i)=>draft(i).forEach(s=>{if(s.kg!==''&&s.reps!=='')sets.push({exercise:e[1],compound:!!e[3],kg:+s.kg,reps:+s.reps,rpe:+s.rpe||null,e1:e1(e,s)})}));S.history.push({date:new Date().toISOString(),session:cur,name:x[1],sets});S.done[cur]=1;Object.keys(S.draft).filter(k=>k.startsWith(cur+'-')).forEach(k=>delete S.draft[k]);cur=cur%12+1;save();renderWorkout()}function renderHistory(){let lifts=[...new Set(S.history.flatMap(h=>h.sets.filter(s=>s.compound).map(s=>s.exercise)))],old=$('liftSelect').value;$('liftSelect').innerHTML=lifts.map(x=>`<option>${x}</option>`).join('')||'<option>No data</option>';if(lifts.includes(old))$('liftSelect').value=old;$('bodyweight').value=S.bw;let lift=$('liftSelect').value,p=[];S.history.forEach(h=>{let a=h.sets.filter(s=>s.exercise===lift);if(a.length)p.push({date:h.date,...a.sort((a,b)=>b.e1-a.e1)[0]})});let v=p.map(x=>x.e1),best=v.length?Math.max(...v):0,latest=v.at(-1),first=v[0];$('bestE1').textContent=best?Math.round(best)+' kg':'—';$('latestE1').textContent=latest?Math.round(latest)+' kg':'—';$('changeE1').textContent=latest?(latest-first>=0?'+':'')+Math.round(latest-first)+' kg':'—';draw(p);$('historyList').innerHTML=p.length?[...p].reverse().map(x=>`<div class="row"><span>${new Date(x.date).toLocaleDateString('en-GB')}</span><span>${x.kg}kg × ${x.reps}</span><b class="green">${Math.round(x.e1)}kg</b><span class="rpe">${x.rpe?'RPE '+x.rpe:''}</span></div>`).join(''):'<div class="empty">No data yet</div>'}function draw(p){if(!p.length){$('chart').innerHTML='<div class="empty">No data yet</div>';return}let v=p.map(x=>x.e1),lo=Math.min(...v)-3,hi=Math.max(...v)+3,xy=v.map((n,i)=>[20+i/Math.max(1,v.length-1)*560,220-(n-lo)/(hi-lo)*190]),d=xy.map((q,i)=>(i?'L':'M')+q.join(' ')).join(' ');$('chart').innerHTML=`<svg viewBox="0 0 600 240" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#baff69" stroke-width="3"/>${xy.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#baff69"/>`).join('')}</svg>`}function exp(){let a=document.createElement('a'),b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='training-data.json';a.click()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));$('prev').onclick=()=>openW((cur+10)%12+1);$('next').onclick=()=>openW(cur%12+1);$('notes').oninput=e=>{S.notes[cur]=e.target.value;save()};$('saveWorkout').onclick=saveSession;$('resetCycle').onclick=()=>{if(confirm('Reset cycle? History stays saved.')){S.done={};S.draft={};cur=1;save();renderWorkout()}};$('liftSelect').onchange=renderHistory;$('bodyweight').onchange=e=>{S.bw=+e.target.value;save();renderHistory()};$('exportBtn').onclick=$('exportTop').onclick=exp;$('importFile').onchange=e=>{let r=new FileReader();r.onload=()=>{S=JSON.parse(r.result);cur=S.cur||1;save();renderWorkout();renderHistory()};r.readAsText(e.target.files[0])};renderStrip();renderCycle();renderWorkout();</script></body></html>
