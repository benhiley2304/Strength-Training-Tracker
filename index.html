<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cycle">
<title>Cycle</title>
<style>
:root{--accent:#0a84ff;--accent2:#5e5ce6;--good:#30d158;--warm:#ff9f0a;--hot:#ff375f;
--bg:#f2f2f5;--bg2:#e8e8ee;--surface:rgba(255,255,255,.8);--solid:#fff;
--text:#14161a;--muted:#6d747f;--hair:rgba(0,0,0,.08);--field:rgba(118,118,128,.1);
--sh:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(15,20,30,.07);
--sh2:0 2px 6px rgba(0,0,0,.06),0 18px 42px rgba(15,20,30,.12);
--r:20px;--ease:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0c;--bg2:#121217;--surface:rgba(28,28,33,.74);--solid:#1a1a20;
--text:#f4f6f8;--muted:#98a0aa;--hair:rgba(255,255,255,.1);--field:rgba(120,124,134,.2);
--sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--sh2:0 2px 6px rgba(0,0,0,.5),0 22px 52px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;letter-spacing:-.011em;background:radial-gradient(1000px 560px at 6% -14%,rgba(10,132,255,.15),transparent 62%),radial-gradient(860px 500px at 98% 2%,rgba(94,92,230,.13),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{width:min(1080px,100%);margin:0 auto;padding:0 20px 120px}
.bar{position:sticky;top:0;z-index:40;background:var(--surface);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--hair)}
.bar-in{width:min(1080px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(10,132,255,.38);display:grid;place-items:center}
.mark svg{width:14px;height:14px;fill:#fff}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--field)}
.seg button{color:var(--muted);font-size:.8rem;font-weight:600;padding:8px 15px;border-radius:9px;min-height:34px;transition:.25s var(--ease)}
.seg button[aria-current="true"]{color:var(--text);background:var(--solid);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.btn{background:var(--field);border-radius:11px;padding:9px 14px;font-size:.78rem;font-weight:600;min-height:38px;transition:transform .18s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(10,132,255,.32)}
.view{display:none;animation:rise .45s var(--ease) both}.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kick{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h1{margin:0;font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.03;letter-spacing:-.035em;font-weight:700}
.lede{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.card{background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh)}
.rail{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:22px 0 18px}
.dot{position:relative;height:46px;border:1px solid var(--hair);border-radius:13px;background:var(--surface);color:var(--muted);font-size:.76rem;font-weight:700;transition:.25s var(--ease)}
.dot:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.dot i{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:14px;height:3px;border-radius:3px}
.dot.heavy i{background:var(--hot)}.dot.medium i{background:var(--warm)}.dot.light i{background:var(--good)}
.dot[aria-current="true"]{color:#fff;border-color:transparent;background:linear-gradient(150deg,var(--accent),var(--accent2));box-shadow:0 10px 24px rgba(10,132,255,.34)}
.dot[aria-current="true"] i{background:rgba(255,255,255,.9)}
.dot.done{color:var(--good)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:24px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:.67rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--hair);background:var(--field);color:var(--muted)}
.pill b{width:7px;height:7px;border-radius:50%}
.pill.heavy b{background:var(--hot)}.pill.medium b{background:var(--warm)}.pill.light b{background:var(--good)}
.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.count{font-size:.72rem;color:var(--muted);font-weight:600}
.acts{display:flex;align-items:center;gap:8px}
.ring{width:72px;height:72px;position:relative;display:grid;place-items:center;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:var(--field)}
.ring .lv{stroke:url(#g1);transition:stroke-dashoffset .5s var(--ease)}
.ring span{font-size:.78rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ico{width:40px;height:40px;border-radius:12px;background:var(--field);display:grid;place-items:center;transition:transform .18s var(--ease)}
.ico:active{transform:scale(.92)}
.ico svg{width:16px;height:16px;stroke:var(--text);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:12px;align-items:start}
.stack{display:grid;gap:10px}
.ex{overflow:hidden;animation:rise .45s var(--ease) both;transition:box-shadow .3s}
.ex:hover{box-shadow:var(--sh2)}
.ex-top{display:flex;align-items:center;gap:14px;padding:15px 18px}
.ex-top .m{flex:1;min-width:0}
.tag{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.ex-top h3{margin:4px 0 0;font-size:.98rem;font-weight:650;letter-spacing:-.02em}
.presc{font-size:.75rem;color:var(--muted);font-weight:550;text-align:right;max-width:210px}
.add{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--field);color:var(--accent);font-size:1.15rem;line-height:1;transition:.2s var(--ease)}
.add:active{transform:scale(.9) rotate(90deg)}
.rows{border-top:1px solid var(--hair);padding:9px 18px 15px}
.row{display:grid;grid-template-columns:20px 1fr 1fr 1fr 58px 32px 26px;gap:8px;align-items:center;margin-top:8px}
.n{font-size:.68rem;color:var(--muted);font-weight:700}
.f{width:100%;min-width:0;border:1px solid var(--hair);background:var(--solid);border-radius:11px;padding:11px 8px;font-size:.83rem;font-weight:600;text-align:center;outline:0;min-height:42px;-moz-appearance:textfield;transition:border-color .18s,box-shadow .18s}
.f::-webkit-outer-spin-button,.f::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.16)}
.est{font-size:.68rem;font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.tick{width:32px;height:32px;border-radius:50%;border:1.6px solid var(--hair);display:grid;place-items:center;transition:.25s var(--ease)}
.tick svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.25s var(--ease)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tick[aria-pressed="true"] svg{opacity:1;transform:none}
.del{color:var(--muted);opacity:.45;font-size:1.05rem;width:26px;height:34px}
.del:hover{opacity:1;color:var(--hot)}
.side{display:grid;gap:10px;position:sticky;top:74px}
.pane{padding:16px 18px}
.pane h4{margin:0 0 12px;font-size:.67rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:grid;gap:7px}
.chip{text-align:left;border:1px solid var(--hair);background:var(--solid);border-radius:13px;padding:12px 13px;font-size:.77rem;font-weight:550;color:var(--muted);min-height:44px;transition:.25s var(--ease)}
.chip[aria-pressed="true"]{border-color:transparent;color:#fff;background:linear-gradient(140deg,var(--accent),var(--accent2))}
.hint{margin:10px 0 0;font-size:.7rem;color:var(--muted);line-height:1.45}
.note{width:100%;min-height:128px;resize:vertical;border:0;background:transparent;outline:0;font-size:.82rem;line-height:1.5}
.note::placeholder{color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:22px 0 16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wk{position:relative;text-align:left;padding:20px;min-height:148px;overflow:hidden;animation:rise .45s var(--ease) both;transition:.3s var(--ease)}
.wk:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.wk .glow{position:absolute;width:150px;height:150px;border-radius:50%;right:-62px;top:-62px;filter:blur(14px);opacity:.2}
.wk.heavy .glow{background:var(--hot)}.wk.medium .glow{background:var(--warm)}.wk.light .glow{background:var(--good)}
.wk small{position:relative;font-size:.63rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk h3{position:relative;margin:28px 0 4px;font-size:1.04rem;font-weight:650;letter-spacing:-.025em}
.wk p{position:relative;margin:0;font-size:.75rem;color:var(--muted)}
.wk .flag{position:absolute;top:16px;right:18px;width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.wk.done .flag{opacity:1}
.wk .flag svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wk[aria-current="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{border:1px solid var(--hair);background:var(--solid);border-radius:12px;padding:11px 12px;font-size:.79rem;font-weight:600;min-height:42px}
.bwx{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--solid);border-radius:12px;padding:2px 12px;font-size:.74rem;color:var(--muted);font-weight:600}
.bwx input{width:60px;border:0;background:transparent;outline:0;font-size:.82rem;font-weight:700;text-align:right;padding:10px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi{padding:17px}
.kpi small{display:block;font-size:.61rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi strong{display:block;margin-top:8px;font-size:1.55rem;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi.up strong{color:var(--good)}.kpi.down strong{color:var(--hot)}
.plot{height:280px;padding:16px;margin-bottom:10px}
.plot svg{width:100%;height:100%;overflow:visible}
.recent{padding:16px 18px;margin-bottom:10px;font-size:.8rem}
.recent b{font-weight:700}
.log{overflow:hidden}
.lr{display:grid;grid-template-columns:108px 1fr 94px 76px;gap:12px;align-items:center;padding:13px 18px;border-top:1px solid var(--hair);font-size:.79rem}
.lr:first-child{border-top:0}
.lr .d{color:var(--muted);font-weight:550}
.lr .v{text-align:right;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.lr .rp{text-align:right;color:var(--muted);font-size:.73rem}
.blank{padding:52px 20px;text-align:center;color:var(--muted);font-size:.82rem}
.foot{display:flex;justify-content:center;gap:8px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:60;padding:12px 18px;border-radius:14px;background:var(--solid);border:1px solid var(--hair);box-shadow:var(--sh2);font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s var(--ease);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{margin:14px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--hot);background:rgba(255,55,95,.08);font-size:.8rem;display:none}
.tabs{display:none}
@media(max-width:900px){.cols{grid-template-columns:1fr}.side{position:static}.cards{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
.wrap{padding:0 14px 130px}.bar-in{padding:0 14px;height:54px}.seg{display:none}
.rail{grid-template-columns:repeat(6,1fr);margin:16px 0 14px}
.hero{flex-direction:column;align-items:stretch;gap:18px;padding:20px}.acts{justify-content:space-between}
.ex-top{flex-wrap:wrap}.presc{text-align:left;max-width:none;flex-basis:100%;order:3}
.head{flex-direction:column;align-items:stretch;gap:14px}
.lr{grid-template-columns:78px 1fr 74px}.lr .rp{display:none}
.plot{height:232px;padding:12px}
.tabs{display:flex;position:fixed;z-index:50;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));padding:6px;gap:4px;border-radius:20px;border:1px solid var(--hair);background:var(--surface);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--sh2)}
.tabs button{flex:1;color:var(--muted);border-radius:15px;padding:9px 0 7px;font-size:.63rem;font-weight:700;display:grid;justify-items:center;gap:4px;min-height:48px;transition:.25s var(--ease)}
.tabs svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:#fff;background:linear-gradient(140deg,var(--accent),var(--accent2))}
}
@media(max-width:400px){.row{grid-template-columns:16px 1fr 1fr 50px 32px 22px}.row .rpe{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
<div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M4 9h2v6H4zM7 7h2v10H7zM15 7h2v10h-2zM18 9h2v6h-2zM10 11h4v2h-4z"/></svg></span>Cycle</div>
<nav class="seg" aria-label="Sections"><button data-nav="train" aria-current="true">Train</button><button data-nav="plan">Plan</button><button data-nav="trends">Trends</button></nav>
<button class="btn" data-act="export">Export</button>
</div></header>

<main class="wrap">
<div class="err card" id="err" role="alert"></div>

<section id="train" class="view on">
<div class="rail" id="rail" aria-label="Sessions"></div>
<div class="card hero">
<div>
<p class="kick" id="kick"></p>
<h1 id="wName"></h1>
<p class="lede" id="wFocus"></p>
<div class="meta-row"><span class="pill" id="wPill"><b></b><span></span></span><span class="count" id="wCount"></span></div>
</div>
<div class="acts">
<div class="ring"><svg viewBox="0 0 72 72" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient></defs><circle class="tr" cx="36" cy="36" r="31"/><circle class="lv" id="ring" cx="36" cy="36" r="31" stroke-dasharray="195" stroke-dashoffset="195"/></svg><span id="ringT">0%</span></div>
<div style="display:flex;gap:6px">
<button class="ico" data-act="prev" aria-label="Previous session"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
<button class="ico" data-act="next" aria-label="Next session"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<button class="btn pri" data-act="save">Save</button>
</div>
</div>
<div class="cols">
<div class="stack" id="list"></div>
<aside class="side">
<div class="card pane" id="condPane"><h4>Conditioning</h4><div class="chips" id="chips"></div><p class="hint" id="condHint"></p></div>
<div class="card pane"><h4>Notes</h4><textarea id="notes" class="note" placeholder="Bar speed, readiness, joints, output…"></textarea></div>
</aside>
</div>
</section>

<section id="plan" class="view">
<div class="head"><div><p class="kick">12-session rotation</p><h1>Plan</h1><p class="lede">Heavy, medium and light exposures alternating upper and lower.</p></div>
<div class="tools"><button class="btn" data-act="today">Go to current</button><button class="btn" data-act="reset">Reset cycle</button></div></div>
<div class="cards" id="cards"></div>
</section>

<section id="trends" class="view">
<div class="head"><div><p class="kick">Estimated 1RM</p><h1>Trends</h1></div>
<div class="tools"><select id="lift" class="sel" aria-label="Lift"></select><label class="bwx">Bodyweight <input id="bw" type="number" step="0.1" inputmode="decimal" aria-label="Bodyweight in kilograms"> kg</label></div></div>
<div class="kpis">
<div class="card kpi"><small>Best</small><strong id="kBest">—</strong></div>
<div class="card kpi"><small>Latest</small><strong id="kLast">—</strong></div>
<div class="card kpi" id="kDeltaBox"><small>Change</small><strong id="kDelta">—</strong></div>
<div class="card kpi"><small>Sessions</small><strong id="kCount">0</strong></div>
</div>
<div class="card plot" id="plot"></div>
<div class="card recent" id="recent" hidden></div>
<div class="card log" id="log"></div>
<div class="foot"><button class="btn" data-act="export">Export JSON</button><label class="btn" for="imp">Import JSON</label><input id="imp" hidden type="file" accept="application/json"></div>
</section>
</main>

<nav class="tabs" aria-label="Sections">
<button data-nav="train" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 9v6M8 7v10M16 7v10M20 9v6M8 12h8"/></svg>Train</button>
<button data-nav="plan"><svg viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg>Plan</button>
<button data-nav="trends"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-8"/><path d="M4 20h16"/></svg>Trends</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

["Horizontal press","Weighted dip / flat DB press",["1\u20132 \u00d7 6\u201310","1\u20132 \u00d7 8\u201312","1\u20132 \u00d7 10\u201315"],2],

["Biceps","Hammer / curl variation",["2 \u00d7 8\u201312","2 \u00d7 10\u201315","2 \u00d7 12\u201315"],0],
["Triceps","Pushdown / overhead extension",["2 \u00d7 10\u201315","2 \u00d7 10\u201315","2 \u00d7 12\u201320"],0],
["Side delts","Cable lateral raise",["2 \u00d7 12\u201320","2\u20133 \u00d7 12\u201320","3 \u00d7 15\u201325"],0],
["Rear delts","Reverse pec deck",["2 \u00d7 12\u201320","2 \u00d7 12\u201320","2\u20133 \u00d7 15\u201325"],0],
["Shoulder quality","External rotation + Y-raise",["\u2014","\u2014","2 rounds"],0]]},
LA:{name:"Lower A",focus:"Back squat + RDL",ex:[
["Squat","Back squat",["1 \u00d7 3\u20135 + optional 1 \u00d7 4\u20136","1 \u00d7 5\u20137 + optional 1 \u00d7 7\u20139","\u2014"],1],
["Hinge","Romanian deadlift",["1\u20132 \u00d7 5\u20138","1\u20132 \u00d7 7\u201310","\u2014"],1],
["Unilateral","DB reverse lunge \u00b7 optional",["1 \u00d7 8\u201310 / leg","\u2014","\u2014"],0],
["Unilateral","DB reverse lunge",["\u2014","1\u20132 \u00d7 8\u201312 / leg","\u2014"],0],
["Unilateral quads","Heel-elevated Bulgarian",["\u2014","\u2014","3 \u00d7 10\u201315 / leg"],0],
["Quads","Leg extension",["\u2014","1 \u00d7 12\u201320","3 \u00d7 12\u201320"],0],
["Hamstrings","Seated leg curl",["2 \u00d7 8\u201312","2 \u00d7 10\u201315","3 \u00d7 10\u201315"],0],
["Posterior chain","Reverse hyper / back extension",["\u2014","\u2014","2 \u00d7 12\u201320"],0],
["Hips","Hip adduction + abduction",["\u2014","\u2014","2 \u00d7 10\u201320 each"],0],
["Calves","Standing calf raise",["2\u20133 \u00d7 8\u201315","2\u20133 \u00d7 10\u201320","3 \u00d7 12\u201320"],0],
["Shins","Tibialis raise",["\u2014","2 \u00d7 15\u201325","2\u20133 \u00d7 15\u201330"],0],
["Abs","Hanging leg raise",["2 \u00d7 8\u201312","\u2014","\u2014"],0],
["Abs","Kneeling cable crunch",["\u2014","3 \u00d7 8\u201315","\u2014"],0],
["Abs","Ab-wheel rollout",["\u2014","\u2014","3 \u00d7 6\u201312"],0],
["Obliques","Pallof press",["2 \u00d7 10\u201315 / side","2 \u00d7 10\u201315 / side","\u2014"],0],
["Obliques / groin","Copenhagen plank",["\u2014","\u2014","2 \u00d7 20\u201340 sec / side"],0]]},
LB:{name:"Lower B",focus:"Deadlift + front squat",ex:[
["Hinge","Conventional deadlift",["1 \u00d7 1\u20133 + 1 \u00d7 3\u20135","1 \u00d7 3\u20135 + optional 1 \u00d7 5\u20137","1\u20132 \u00d7 3\u20135 @ RPE 7\u20138 \u00b7 optional"],1],
["Squat","Front squat",["1\u20132 \u00d7 4\u20136","2 \u00d7 6\u20138","2 \u00d7 8\u201310"],1],
["Unilateral","Walking or reverse lunge",["\u2014","\u2014","2 \u00d7 10\u201316 steps / leg"],0],
["Hamstrings","Seated leg curl",["2 \u00d7 8\u201312","2 \u00d7 10\u201315","3 \u00d7 10\u201315"],0],
["Quads","Leg extension",["1\u20132 \u00d7 10\u201315","2 \u00d7 12\u201320","2\u20133 \u00d7 12\u201320"],0],
["Posterior chain","Reverse hyper / back extension",["\u2014","\u2014","2 \u00d7 12\u201320"],0],
["Soleus","Seated calf raise",["2\u20133 \u00d7 10\u201320","2\u20133 \u00d7 10\u201320","3 \u00d7 12\u201325"],0],
["Shins","Tibialis raise",["2 \u00d7 15\u201325","\u2014","2\u20133 \u00d7 15\u201330"],0],
["Hips","Hip adduction / abduction",["\u2014","2 \u00d7 10\u201320","2 \u00d7 12\u201320"],0],
["Abs","Hanging knee raise",["2 \u00d7 8\u201312","\u2014","\u2014"],0],
["Abs","Weighted decline / cable crunch",["\u2014","3 \u00d7 8\u201315","3 \u00d7 8\u201315"],0],
["Obliques","Side plank",["2 \u00d7 30\u201345 sec / side","2 \u00d7 30\u201345 sec / side","\u2014"],0],
["Obliques","Suitcase carry",["\u2014","\u2014","2 \u00d7 20\u201340 m / side"],0]]}
};
var SEQ=[["UA","heavy"],["LA","medium"],["UB","light"],["LB","heavy"],["UA","medium"],["LA","light"],["UB","heavy"],["LB","medium"],["UA","light"],["LA","heavy"],["UB","medium"],["LB","light"]];
var COND={2:["Easy bike \u00b7 10\u201320 min","None"],4:["Easy bike / walk \u00b7 10\u201315 min","None"],6:["Bike + ropes \u00b7 4\u20136 rounds","Zone 2 \u00b7 20\u201335 min","None"],8:["Easy bike \u00b7 10\u201315 min","Easy row if fresh \u00b7 10\u201315 min","None"],10:["Easy bike / walk \u00b7 10\u201315 min","None"],12:["Bike + ropes \u00b7 4\u20136 rounds","Rower + ropes \u00b7 3\u20135 rounds","Wall balls + ropes \u00b7 4\u20136 rounds","Zone 2 \u00b7 20\u201335 min","None"]};
var LEVEL={heavy:0,medium:1,light:2},LABEL={heavy:"Heavy",medium:"Medium",light:"Light"};
var W=SEQ.map(function(s,i){
var t=T[s[0]],lv=LEVEL[s[1]];
var ex=t.ex.filter(function(e){return e[2][lv]!=="\u2014";}).map(function(e){return{cat:e[0],name:e[1],presc:e[2][lv],mode:e[3]||0};});
return{id:i+1,intensity:s[1],name:LABEL[s[1]]+" "+t.name,focus:t.focus,ex:ex,cond:COND[i+1]||null};});

function emptyState(){return{cur:1,done:{},draft:{},notes:{},choice:{},history:[],bw:88};}
var S=emptyState();
try{var raw=localStorage.getItem(KEY);if(raw){var parsed=JSON.parse(raw);if(parsed&&typeof parsed==="object"){Object.keys(parsed).forEach(function(k){S[k]=parsed[k];});}}}catch(e){}
if(!Array.isArray(S.history))S.history=[];
if(!S.draft||typeof S.draft!=="object")S.draft={};
var cur=(Number(S.cur)>=1&&Number(S.cur)<=TOTAL)?Number(S.cur):1;
var noteTimer=null;

function $(id){return document.getElementById(id);}
function showError(msg){var el=$("err");el.textContent=msg;el.style.display="block";}
function toast(msg){var el=$("toast");el.textContent=msg;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("on");},2400);}
function persist(){try{S.cur=cur;localStorage.setItem(KEY,JSON.stringify(S));}catch(e){showError("Storage is unavailable or full. Export a JSON backup before continuing.");}}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function session(){return W[cur-1];}
function draft(i){var k=cur+"-"+i;if(!Array.isArray(S.draft[k]))S.draft[k]=[{kg:"",reps:"",rpe:"",done:false}];return S.draft[k];}
function bodyweight(){var n=parseFloat(S.bw);return isFinite(n)?n:0;}
function epley(kg,reps){if(!isFinite(kg)||!isFinite(reps)||reps<1)return null;return reps<=1?kg:kg*(1+reps/30);}
function estimate(mode,set){
var kg=parseFloat(set.kg),reps=parseFloat(set.reps);
if(!isFinite(kg)||!isFinite(reps)||reps<1)return null;
if(mode===2){var bw=bodyweight(),total=epley(kg+bw,reps);return total==null?null:total-bw;}
return epley(kg,reps);}

function showView(view){
["train","plan","trends"].forEach(function(id){var el=$(id);if(el)el.classList.toggle("on",id===view);});
Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"),function(b){
if(b.getAttribute("data-nav")===view)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current");});
if(view==="trends")renderTrends();
window.scrollTo({top:0,behavior:"smooth"});}

function goToSession(id){
var n=Number(id);
if(!isFinite(n)||n<1||n>TOTAL)return;
cur=n;persist();renderWorkout();renderNav();showView("train");}

function renderNav(){
$("rail").innerHTML=W.map(function(w){
return "<button class=\"dot "+w.intensity+(S.done[w.id]?" done":"")+"\" data-session=\""+w.id+"\""+(w.id===cur?" aria-current=\"true\"":"")+" aria-label=\"Session "+w.id+", "+esc(w.name)+"\">"+(S.done[w.id]?"\u2713":w.id)+"<i></i></button>";}).join("");
$("cards").innerHTML=W.map(function(w,k){
return "<button class=\"card wk "+w.intensity+(S.done[w.id]?" done":"")+"\" data-session=\""+w.id+"\" style=\"animation-delay:"+(k*22)+"ms\""+(w.id===cur?" aria-current=\"true\"":"")+"><span class=\"glow\"></span><span class=\"flag\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/></svg></span><small>"+(w.id<10?"0"+w.id:w.id)+" \u00b7 "+w.intensity+"</small><h3>"+esc(w.name)+"</h3><p>"+esc(w.focus)+"</p></button>";}).join("");}

function rowHtml(i,j,set,mode){
var v=estimate(mode,set),est=(mode&&v!=null)?Math.round(v)+" e1":"";
return "<div class=\"row\" data-i=\""+i+"\" data-j=\""+j+"\">"+
"<span class=\"n\">"+(j+1)+"</span>"+
"<input class=\"f\" type=\"number\" step=\"0.5\" inputmode=\"decimal\" data-k=\"kg\" value=\""+esc(set.kg)+"\" placeholder=\"kg\" aria-label=\"Weight in kilograms\">"+
"<input class=\"f\" type=\"number\" inputmode=\"numeric\" data-k=\"reps\" value=\""+esc(set.reps)+"\" placeholder=\"reps\" aria-label=\"Repetitions\">"+
"<input class=\"f rpe\" type=\"number\" step=\"0.5\" inputmode=\"decimal\" data-k=\"rpe\" value=\""+esc(set.rpe)+"\" placeholder=\"RPE\" aria-label=\"RPE\">"+
"<span class=\"est\">"+est+"</span>"+
"<button class=\"tick\" data-act=\"tick\" aria-pressed=\""+(set.done?"true":"false")+"\" aria-label=\"Mark set complete\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/></svg></button>"+
"<button class=\"del\" data-act=\"del\" aria-label=\"Remove set\">\u00d7</button>"+
"</div>";}

function renderWorkout(){
var w=session();
$("kick").textContent="Session "+(w.id<10?"0"+w.id:w.id)+" of "+TOTAL;
$("wName").textContent=w.name;
$("wFocus").textContent=w.focus;
var pill=$("wPill");pill.className="pill "+w.intensity;pill.lastElementChild.textContent=LABEL[w.intensity]+" day";
$("notes").value=S.notes[cur]||"";
$("list").innerHTML=w.ex.map(function(e,i){
return "<article class=\"card ex\" style=\"animation-delay:"+(i*20)+"ms\">"+
"<div class=\"ex-top\"><div class=\"m\"><div class=\"tag\">"+esc(e.cat)+"</div><h3>"+esc(e.name)+"</h3></div>"+
"<div class=\"presc\">"+esc(e.presc)+"</div>"+
"<button class=\"add\" data-act=\"add\" data-i=\""+i+"\" aria-label=\"Add set to "+esc(e.name)+"\">+</button></div>"+
"<div class=\"rows\">"+draft(i).map(function(s,j){return rowHtml(i,j,s,e.mode);}).join("")+"</div></article>";}).join("");
var pane=$("condPane");
if(w.cond){pane.style.display="";
$("chips").innerHTML=w.cond.map(function(c,i){return "<button class=\"chip\" data-act=\"chip\" data-i=\""+i+"\" aria-pressed=\""+(S.choice[cur]===i?"true":"false")+"\">"+esc(c)+"</button>";}).join("");
$("condHint").textContent=w.id===12?"Walking lunges pair better with bike, rower or zone 2 than with wall balls.":"";}
else{pane.style.display="none";}
renderRing();}

function renderRing(){
var w=session(),total=0,done=0;
w.ex.forEach(function(e,i){draft(i).forEach(function(s){total++;if(s.done)done++;});});
var pct=total?done/total:0;
$("ring").setAttribute("stroke-dashoffset",String(DASH-DASH*pct));
$("ringT").textContent=Math.round(pct*100)+"%";
$("wCount").textContent=done+" of "+total+" sets logged";}

function addSet(i){var d=draft(i),last=d[d.length-1]||{};d.push({kg:last.kg||"",reps:"",rpe:"",done:false});persist();renderWorkout();}
function removeSet(i,j){var d=draft(i);d.splice(j,1);if(!d.length)d.push({kg:"",reps:"",rpe:"",done:false});persist();renderWorkout();}
function toggleSet(i,j,btn){var s=draft(i)[j];if(!s)return;s.done=!s.done;persist();
btn.setAttribute("aria-pressed",s.done?"true":"false");renderRing();renderNav();
if(s.done&&navigator.vibrate)navigator.vibrate(8);}

function saveWorkout(){
var w=session(),sets=[];
w.ex.forEach(function(e,i){draft(i).forEach(function(s){
var kg=parseFloat(s.kg),reps=parseFloat(s.reps);
if(isFinite(kg)&&isFinite(reps)&&reps>0){
var v=estimate(e.mode,s);
sets.push({exercise:e.name,category:e.cat,compound:!!e.mode,mode:e.mode,kg:kg,reps:reps,rpe:s.rpe===""?null:parseFloat(s.rpe),e1:v==null?kg:v});}});});
if(!sets.length&&!window.confirm("Save this workout with no logged sets?"))return;
S.history.push({id:Date.now(),date:new Date().toISOString(),session:cur,name:w.name,notes:S.notes[cur]||"",conditioning:w.cond?(w.cond[S.choice[cur]]||""):"",sets:sets});
S.done[cur]=true;
Object.keys(S.draft).forEach(function(k){if(k.indexOf(cur+"-")===0)delete S.draft[k];});
var saved=w.name;
cur=cur%TOTAL+1;persist();renderWorkout();renderNav();
toast(saved+" saved \u00b7 up next: "+session().name);}

function renderTrends(){
$("bw").value=S.bw;
$("kCount").textContent=S.history.length;
var lifts=[];
S.history.forEach(function(h){(h.sets||[]).forEach(function(s){if(s.compound&&lifts.indexOf(s.exercise)<0)lifts.push(s.exercise);});});
var sel=$("lift"),prev=sel.value;
sel.innerHTML=lifts.length?lifts.map(function(l){return "<option>"+esc(l)+"</option>";}).join(""):"<option>No compound data yet</option>";
if(lifts.indexOf(prev)>=0)sel.value=prev;
var lift=sel.value,pts=[];
S.history.forEach(function(h){
var m=(h.sets||[]).filter(function(s){return s.exercise===lift;});
if(m.length){var b=m.slice().sort(function(a,c){return c.e1-a.e1;})[0];
pts.push({date:h.date,kg:b.kg,reps:b.reps,rpe:b.rpe,e1:b.e1});}});
var v=pts.map(function(p){return p.e1;});
var best=v.length?Math.max.apply(null,v):null,last=v.length?v[v.length-1]:null,first=v.length?v[0]:null;
$("kBest").textContent=best!=null?Math.round(best)+" kg":"\u2014";
$("kLast").textContent=last!=null?Math.round(last)+" kg":"\u2014";
var d=(last!=null&&first!=null)?Math.round(last-first):null;
$("kDelta").textContent=d==null?"\u2014":(d>=0?"+":"")+d+" kg";
$("kDeltaBox").className="card kpi"+(d==null?"":(d>=0?" up":" down"));
plot(pts);
var recent=$("recent");
if(pts.length){var p=pts[pts.length-1];recent.hidden=false;
recent.innerHTML="Last "+esc(lift)+" \u00b7 <b>"+p.kg+" kg \u00d7 "+p.reps+"</b>"+(p.rpe?" at RPE "+p.rpe:"")+" \u00b7 estimated 1RM <b>"+Math.round(p.e1)+" kg</b>";}
else recent.hidden=true;
$("log").innerHTML=pts.length?pts.slice().reverse().map(function(p){
return "<div class=\"lr\"><span class=\"d\">"+new Date(p.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"})+"</span><span>"+p.kg+" kg \u00d7 "+p.reps+"</span><span class=\"v\">"+Math.round(p.e1)+" kg</span><span class=\"rp\">"+(p.rpe?"RPE "+p.rpe:"")+"</span></div>";}).join(""):"<div class=\"blank\">Log a compound set, then save the workout to start building your strength history.</div>";}

function plot(pts){
var el=$("plot");
if(!pts.length){el.innerHTML="<div class=\"blank\">No data yet</div>";return;}
var v=pts.map(function(p){return p.e1;});
var lo=Math.min.apply(null,v)-4,hi=Math.max.apply(null,v)+4,span=(hi-lo)||1;
var xy=v.map(function(n,i){return [30+(pts.length===1?260:i/(pts.length-1)*540),212-(n-lo)/span*172];});
var line=xy.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
var area=line+" L "+xy[xy.length-1][0].toFixed(1)+" 212 L "+xy[0][0].toFixed(1)+" 212 Z";
var grid=[0,0.5,1].map(function(f){var y=(40+f*172).toFixed(1);return "<line x1=\"30\" x2=\"570\" y1=\""+y+"\" y2=\""+y+"\" stroke=\"currentColor\" stroke-opacity=\".1\"/>";}).join("");
el.innerHTML="<svg viewBox=\"0 0 600 240\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Estimated one rep max over time\">"+
"<defs><linearGradient id=\"fl\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0a84ff\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#0a84ff\" stop-opacity=\"0\"/></linearGradient>"+
"<linearGradient id=\"st\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#0a84ff\"/><stop offset=\"1\" stop-color=\"#5e5ce6\"/></linearGradient></defs>"+grid+
"<path d=\""+area+"\" fill=\"url(#fl)\"/><path d=\""+line+"\" fill=\"none\" stroke=\"url(#st)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/>"+
xy.map(function(p,i){return "<circle cx=\""+p[0].toFixed(1)+"\" cy=\""+p[1].toFixed(1)+"\" r=\"4.5\" fill=\"var(--solid)\" stroke=\"url(#st)\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><title>"+Math.round(v[i])+" kg</title></circle>";}).join("")+
"<text x=\"30\" y=\"26\" font-size=\"11\" fill=\"currentColor\" opacity=\".55\">"+Math.round(hi)+" kg</text>"+
"<text x=\"30\" y=\"234\" font-size=\"11\" fill=\"currentColor\" opacity=\".55\">"+Math.round(lo)+" kg</text></svg>";}

function exportData(){
try{
var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
var a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="cycle-training-data.json";
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
toast("Backup downloaded");}
catch(e){showError("Export is not supported in this browser.");}}

function validBackup(d){return d&&typeof d==="object"&&Array.isArray(d.history);}

document.addEventListener("click",function(ev){
var target=ev.target;
if(!target||!target.closest)return;
var navBtn=target.closest("[data-nav]");
if(navBtn){showView(navBtn.getAttribute("data-nav"));return;}
var sessionBtn=target.closest("[data-session]");
if(sessionBtn){ev.preventDefault();goToSession(sessionBtn.getAttribute("data-session"));return;}
var act=target.closest("[data-act]");
if(!act)return;
var a=act.getAttribute("data-act");
if(a==="prev"){goToSession((cur+TOTAL-2)%TOTAL+1);return;}
if(a==="next"){goToSession(cur%TOTAL+1);return;}
if(a==="save"){saveWorkout();return;}
if(a==="today"){goToSession(cur);return;}
if(a==="export"){exportData();return;}
if(a==="reset"){
if(window.confirm("Reset cycle ticks and drafts? Saved history is kept.")){
S.done={};S.draft={};S.notes={};S.choice={};cur=1;persist();renderWorkout();renderNav();toast("Cycle reset");}
return;}
if(a==="add"){addSet(Number(act.getAttribute("data-i")));return;}
if(a==="chip"){
var idx=Number(act.getAttribute("data-i"));S.choice[cur]=idx;persist();
Array.prototype.forEach.call(document.querySelectorAll("#chips .chip"),function(c,n){c.setAttribute("aria-pressed",n===idx?"true":"false");});
return;}
var row=act.closest(".row");
if(row){
var i=Number(row.getAttribute("data-i")),j=Number(row.getAttribute("data-j"));
if(a==="tick"){toggleSet(i,j,act);return;}
if(a==="del"){removeSet(i,j);return;}}
},false);

$("list").addEventListener("input",function(ev){
var input=ev.target;
if(!input||!input.getAttribute||!input.getAttribute("data-k"))return;
var row=input.closest(".row");
if(!row)return;
var i=Number(row.getAttribute("data-i")),j=Number(row.getAttribute("data-j"));
var set=draft(i)[j];
if(!set)return;
set[input.getAttribute("data-k")]=input.value;
persist();
var mode=session().ex[i].mode;
if(mode){var v=estimate(mode,set),est=row.querySelector(".est");if(est)est.textContent=v!=null?Math.round(v)+" e1":"";}
},false);

$("notes").addEventListener("input",function(ev){
var value=ev.target.value;
clearTimeout(noteTimer);
noteTimer=setTimeout(function(){S.notes[cur]=value;persist();},350);
},false);

$("lift").addEventListener("change",renderTrends,false);
$("bw").addEventListener("change",function(ev){
var n=parseFloat(ev.target.value);
S.bw=isFinite(n)?n:0;persist();renderWorkout();renderTrends();},false);

$("imp").addEventListener("change",function(ev){
var file=ev.target.files&&ev.target.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(){
try{
var parsed=JSON.parse(reader.result);
if(!validBackup(parsed))throw new Error("bad");
S=emptyState();
Object.keys(parsed).forEach(function(k){S[k]=parsed[k];});
cur=(Number(S.cur)>=1&&Number(S.cur)<=TOTAL)?Number(S.cur):1;
persist();renderWorkout();renderNav();renderTrends();toast("Backup restored");}
catch(e){showError("That file could not be read as a Cycle backup.");}};
reader.readAsText(file);
ev.target.value="";
},false);

document.addEventListener("keydown",function(ev){
var tag=ev.target&&ev.target.tagName;
if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
if(ev.key==="ArrowRight")goToSession(cur%TOTAL+1);
if(ev.key==="ArrowLeft")goToSession((cur+TOTAL-2)%TOTAL+1);
},false);

window.addEventListener("error",function(){
showError("Something went wrong. Your saved training data is still stored locally. Reload to continue.");},false);

try{renderNav();renderWorkout();}
catch(e){showError("The session view failed to load. Reload to continue.");}
})();
</script>
