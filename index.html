<style>
:root{--bg:#080a0d;--side:#0b0e12;--card:#101419;--card2:#141a20;--line:#222a32;--text:#f5f7f8;--muted:#788591;--green:#baff69;--cyan:#60e6ed;--red:#ff647b;--amber:#ffc35a;--radius:15px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:24px 14px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 28px;font-size:.76rem;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.brand-mark{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 22px rgba(186,255,105,.65)}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:10px;text-align:left;padding:11px 12px;cursor:pointer;font-size:.78rem;font-weight:850}.nav button:hover,.nav button.active{background:#151b21;color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--green)}.side-cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:26px;padding:0 5px}.side-slot{aspect-ratio:1;border:1px solid var(--line);background:#0e1318;color:var(--muted);border-radius:8px;cursor:pointer;font-size:.65rem;font-weight:900}.side-slot.current{border-color:var(--green);color:var(--text)}.side-slot.done{color:var(--green);background:#141d0f}.main{min-width:0;padding:24px 28px 80px;max-width:1180px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;height:44px;margin-bottom:24px}.status{font-size:.7rem;color:var(--muted)}.status b{color:var(--text)}.top-actions{display:flex;gap:6px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.75rem;font-weight:850}.btn:hover{border-color:#3b4650}.btn.primary{background:var(--green);border-color:var(--green);color:#091005}.view{display:none}.view.active{display:block}.workout-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:17px}.eyebrow{font-size:.62rem;color:var(--cyan);font-weight:950;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}.workout-head h1,.page-head h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:.92;letter-spacing:-.065em;margin:0}.workout-head p,.page-head p{color:var(--muted);font-size:.82rem;margin:8px 0 0}.workout-actions{display:flex;gap:6px}.cycle-rail{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-bottom:14px}.rail-slot{height:35px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;cursor:pointer;font-size:.68rem;font-weight:900;position:relative}.rail-slot:after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:12px;height:2px;border-radius:9px}.rail-slot.heavy:after{background:var(--red)}.rail-slot.medium:after{background:var(--amber)}.rail-slot.light:after{background:var(--green)}.rail-slot.current{border-color:var(--green);color:var(--text)}.rail-slot.done{background:#141d0f;color:var(--green)}.progress{height:3px;background:#161c22;border-radius:99px;overflow:hidden;margin-bottom:11px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:.25s}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px}.exercise-list{display:grid;gap:7px}.exercise{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.exercise-head{display:grid;grid-template-columns:minmax(180px,1fr) minmax(160px,.75fr) 28px;gap:10px;align-items:center;padding:12px 13px}.category{font-size:.56rem;color:var(--cyan);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.exercise h3{font-size:.86rem;margin:3px 0 0}.target{font-size:.72rem;color:#bcc6cf;font-weight:750}.add{width:28px;height:28px;border:1px solid var(--line);background:#090c0f;color:var(--muted);border-radius:8px;cursor:pointer}.sets{border-top:1px solid var(--line);padding:7px 13px 10px}.set-row{display:grid;grid-template-columns:24px 1fr 1fr 1fr 57px 25px 22px;gap:6px;align-items:center;margin-top:5px}.set-number{font-size:.62rem;color:var(--muted);font-weight:900}.field{width:100%;min-width:0;border:1px solid var(--line);background:#090c0f;color:var(--text);border-radius:8px;padding:8px;font-size:.73rem;outline:0}.field:focus{border-color:var(--cyan)}.e1{font-size:.62rem;color:var(--green);font-weight:850;text-align:right}.tick{width:25px;height:25px;border:1px solid #39444e;background:transparent;color:#071004;border-radius:7px;cursor:pointer}.tick.on{background:var(--green);border-color:var(--green)}.remove{border:0;background:transparent;color:#53606b;cursor:pointer}.side-stack{display:grid;align-content:start;gap:8px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px}.panel h3{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#cfd6dd;margin:0 0 10px}.notes{width:100%;min-height:110px;border:0;background:transparent;color:var(--text);outline:0;resize:vertical;font-size:.75rem}.choices{display:grid;gap:5px}.choice{border:1px solid var(--line);background:#090c0f;color:var(--muted);border-radius:9px;padding:8px;text-align:left;cursor:pointer;font-size:.68rem}.choice.on{border-color:#617b42;background:#151e0f;color:#dfffbd}.page-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.cycle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cycle-card{position:relative;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--radius);padding:15px;text-align:left;cursor:pointer;min-height:125px}.cycle-card:hover{border-color:#3a4650}.cycle-card.done{opacity:.55}.cycle-card.done:after{content:"✓";position:absolute;right:13px;top:11px;color:var(--green);font-weight:950}.cycle-card small{color:var(--muted);font-size:.59rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900}.cycle-card h3{font-size:.95rem;margin:24px 0 3px}.cycle-card p{color:var(--muted);font-size:.68rem;margin:0}.intensity-line{width:22px;height:3px;border-radius:9px;margin-top:12px}.intensity-line.heavy{background:var(--red)}.intensity-line.medium{background:var(--amber)}.intensity-line.light{background:var(--green)}.history-controls{display:flex;gap:6px;align-items:center}.select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px;font-size:.72rem}.bw{width:70px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px}.metric small{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:900}.metric strong{display:block;font-size:1.45rem;letter-spacing:-.04em;margin-top:5px}.chart{height:280px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px}.chart svg{width:100%;height:100%}.history-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.history-row{display:grid;grid-template-columns:105px 1fr 100px 70px;gap:10px;padding:11px 13px;border-top:1px solid var(--line);font-size:.72rem}.history-row:first-child{border:0}.history-row .date{color:var(--muted)}.history-row .value{color:var(--green);font-weight:900}.empty{text-align:center;color:var(--muted);padding:35px;font-size:.75rem}.data-actions{display:flex;justify-content:center;gap:6px;margin-top:15px}.mobile-nav{display:none}@media(max-width:960px){.shell{grid-template-columns:180px minmax(0,1fr)}.main{padding:22px 18px 80px}.layout{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.cycle-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){body{padding-bottom:64px}.shell{display:block}.sidebar{display:none}.main{padding:14px 10px 78px}.topbar{margin-bottom:16px}.cycle-rail{grid-template-columns:repeat(6,1fr)}.workout-head{display:block}.workout-actions{margin-top:13px}.exercise-head{grid-template-columns:1fr 28px}.target{grid-column:1}.add{grid-column:2;grid-row:1/3}.set-row{grid-template-columns:20px 1fr 1fr 48px 25px 20px}.set-row .rpe-field{display:none}.side-stack{grid-template-columns:1fr}.page-head{display:block}.history-controls{margin-top:12px;flex-wrap:wrap}.metrics{grid-template-columns:repeat(2,1fr)}.history-row{grid-template-columns:76px 1fr 65px}.history-row .rpe-col{display:none}.mobile-nav{display:grid;position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding:6px 9px env(safe-area-inset-bottom);grid-template-columns:repeat(3,1fr);background:rgba(8,10,13,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:.68rem;font-weight:900;border-radius:9px}.mobile-nav button.active{background:#151d10;color:var(--green)}}
</style>

<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><i class="brand-mark"></i>Cycle</div><nav class="nav"><button class="active" data-view="train">Train</button><button data-view="cycle">Cycle</button><button data-view="progressView">Progress</button></nav><div id="sideCycle" class="side-cycle"></div></aside>
<main class="main">
<header class="topbar"><div class="status">Session <b id="topSession">1 of 12</b></div><div class="top-actions"><button class="btn" id="exportTop">Export</button></div></header>
<section id="train" class="view active"><div id="cycleRail" class="cycle-rail"></div><div class="workout-head"><div><div id="eyebrow" class="eyebrow"></div><h1 id="workoutName"></h1><p id="workoutFocus"></p></div><div class="workout-actions"><button class="btn" id="prev">←</button><button class="btn" id="next">→</button><button class="btn primary" id="saveWorkout">Save workout</button></div></div><div class="progress"><i id="setProgress"></i></div><div class="layout"><div id="exerciseList" class="exercise-list"></div><aside class="side-stack"><div class="panel" id="conditioningPanel"><h3>Conditioning</h3><div id="conditioningChoices" class="choices"></div></div><div class="panel"><h3>Notes</h3><textarea id="notes" class="notes" placeholder="Session notes"></textarea></div></aside></div></section>
<section id="cycle" class="view"><div class="page-head"><div><div class="eyebrow">12-session rotation</div><h1>Cycle</h1></div><button class="btn" id="resetCycle">Reset cycle</button></div><div id="cycleGrid" class="cycle-grid"></div></section>
<section id="progressView" class="view"><div class="page-head"><div><div class="eyebrow">Strength history</div><h1>Progress</h1></div><div class="history-controls"><select id="liftSelect" class="select"></select><label class="select">BW <input id="bodyweight" class="field bw" type="number" step=".1"> kg</label></div></div><div class="metrics"><div class="metric"><small>Best e1RM</small><strong id="bestE1">—</strong></div><div class="metric"><small>Latest e1RM</small><strong id="latestE1">—</strong></div><div class="metric"><small>Change</small><strong id="changeE1">—</strong></div><div class="metric"><small>Logged sessions</small><strong id="loggedSessions">0</strong></div></div><div id="chart" class="chart"></div><div id="historyList" class="history-list"></div><div class="data-actions"><button class="btn" id="exportData">Export JSON</button><label class="btn" for="importData">Import JSON</label><input id="importData" hidden type="file" accept="application/json"></div></section>
</main></div><nav class="mobile-nav"><button class="active" data-view="train">Train</button><button data-view="cycle">Cycle</button><button data-view="progressView">Progress</button></nav>
<script>
const templates={UA:{name:'Upper A',focus:'Bench + barbell row',ex:[['Horizontal press','Bench press',['1 × 3–5 + optional 1 × 5–7','1 × 5–7 + optional 1 × 7–9','1–2 × 8–10'],1],['Horizontal pull','Barbell row',['2 × 5–7','2 × 6–8','2 × 8–10'],1],['Vertical press','High-incline DB press',['1–2 × 6–10','1–2 × 8–12','1–2 × 10–15'],1],['Vertical pull','Weighted pull-up',['1–2 × 5–8','1–2 × 6–10','1–2 × 8–12'],2],['Biceps','Curl variation',['2 × 8–12','2 × 10–15','2 × 12–15']],['Triceps','Overhead cable extension',['2 × 8–12','2 × 10–15','2 × 12–20']],['Side delts','Cable lateral raise',['2 × 12–20','2 × 12–20','3 × 15–25']],['Rear delts','Reverse pec deck / face pull',['2 × 12–20','2 × 12–20','2–3 × 15–25']]]},UB:{name:'Upper B',focus:'OHP + weighted pull-up',ex:[['Vertical press','Barbell OHP',['1 × 3–5 + optional 1 × 5–7','1 × 5–7 + optional 1 × 7–9','1–2 × 8–10'],1],['Vertical pull','Weighted pull-up',['2 × 3–6','2 × 5–8','1–2 × 8–10'],2],['Horizontal press','Weighted dip / flat DB press',['1–2 × 6–10','1–2 × 8–12','1–2 × 10–15'],2],['Horizontal pull','Chest-supported / cable row',['2 × 8–10','2 × 10–12','2 × 12–15']],['Biceps','Hammer / curl variation',['2 × 8–12','2 × 10–15','2 × 12–15']],['Triceps','Pushdown / overhead extension',['2 × 10–15','2 × 10–15','2 × 12–20']],['Side delts','Cable lateral raise',['2 × 12–20','2–3 × 12–20','3 × 15–25']],['Rear delts','Reverse pec deck',['2 × 12–20','2 × 12–20','2–3 × 15–25']],['Shoulder quality','External rotation + Y-raise',['—','—','2 rounds']]]},LA:{name:'Lower A',focus:'Back squat + RDL',ex:[['Squat','Back squat',['1 × 3–5 + optional 1 × 4–6','1 × 5–7 + optional 1 × 7–9','—'],1],['Hinge','Romanian deadlift',['1–2 × 5–8','1–2 × 7–10','—'],1],['Unilateral','DB reverse lunge',['1 × 8–10 / leg optional','1–2 × 8–12 / leg','—']],['Unilateral quads','Heel-elevated Bulgarian',['—','—','3 × 10–15 / leg']],['Quads','Leg extension',['—','1 × 12–20','3 × 12–20']],['Hamstrings','Leg curl',['2 × 8–12','2 × 10–15','3 × 10–15']],['Posterior chain','Reverse hyper / back extension',['—','—','2 × 12–20']],['Hips','Hip adduction + abduction',['—','—','2 × 10–20 each']],['Calves','Standing calf raise',['2–3 × 8–15','2–3 × 10–20','3 × 12–20']],['Shins','Tibialis raise',['—','2 × 15–25','2–3 × 15–30']],['Abs','Hanging raise / cable crunch / ab wheel',['2 × 8–12','3 × 8–15','3 × 6–12']],['Obliques','Pallof press / Copenhagen plank',['2 × 10–15 / side','2 × 10–15 / side','2 × 20–40 sec / side']]]},LB:{name:'Lower B',focus:'Deadlift + front squat',ex:[['Hinge','Conventional deadlift',['1 × 1–3 + 1 × 3–5','1 × 3–5 + optional 1 × 5–7','1–2 × 3–5 technique'],1],['Squat','Front squat',['1–2 × 4–6','2 × 6–8','2 × 8–10'],1],['Unilateral','Walking / reverse lunge',['—','—','2 × 10–16 steps / leg']],['Hamstrings','Leg curl',['2 × 8–12','2 × 10–15','3 × 10–15']],['Quads','Leg extension',['1–2 × 10–15','2 × 12–20','2–3 × 12–20']],['Posterior chain','Reverse hyper / back extension',['—','—','2 × 12–20']],['Soleus','Seated calf raise',['2–3 × 10–20','2–3 × 10–20','3 × 12–25']],['Shins','Tibialis raise',['2 × 15–25','—','2–3 × 15–30']],['Hips','Hip adduction / abduction',['—','2 × 10–20','2 × 12–20']],['Abs','Hanging raise / decline crunch / cable crunch',['2 × 8–12','3 × 8–15','3 × 8–15']],['Obliques','Side plank / suitcase carry',['2 × 30–45 sec / side','2 × 30–45 sec / side','2 × 20–40 m / side']]]}};
const seq=[['UA','heavy'],['LA','medium'],['UB','light'],['LB','heavy'],['UA','medium'],['LA','light'],['UB','heavy'],['LB','medium'],['UA','light'],['LA','heavy'],['UB','medium'],['LB','light']];const conditions={2:['Easy bike · 10–20 min','None'],4:['Easy bike / walk · 10–15 min','None'],6:['Bike + ropes · 4–6 rounds','Zone 2 · 20–35 min','None'],8:['Easy bike · 10–15 min','Easy row if fresh','None'],10:['Easy bike / walk · 10–15 min','None'],12:['Bike + ropes · 4–6 rounds','Rower + ropes · 3–5 rounds','Wall balls + ropes · 4–6 rounds','Zone 2 · 20–35 min','None']};const names={heavy:'Heavy',medium:'Medium',light:'Light'},level={heavy:0,medium:1,light:2};const workouts=seq.map((s,i)=>{let t=templates[s[0]],ex=t.ex.filter(e=>e[2][level[s[1]]]!=='—').map(e=>[e[0],e[1],e[2][level[s[1]]],e[3]||0]);return{id:i+1,key:s[0],intensity:s[1],name:names[s[1]]+' '+t.name,focus:t.focus,ex,conditioning:conditions[i+1]||null}});
const KEY='cycleLogV1';let state=load(),current=state.cur||1;function blank(){return{cur:1,done:{},draft:{},notes:{},choice:{},history:[],bw:88}}function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return blank()}}function save(){state.cur=current;localStorage.setItem(KEY,JSON.stringify(state));renderNavigation()}function workout(){return workouts[current-1]}function draft(i){let k=current+'-'+i;if(!state.draft[k])state.draft[k]=[{kg:'',reps:'',rpe:'',done:false}];return state.draft[k]}function show(view){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===view));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='train')renderWorkout();if(view==='progressView')renderHistory();scrollTo({top:0,behavior:'smooth'})}function openWorkout(id){current=id;save();renderWorkout();show('train')}function navButton(w,cls){return`<button class="${cls} ${w.intensity} ${w.id===current?'current':''} ${state.done[w.id]?'done':''}" onclick="openWorkout(${w.id})">${state.done[w.id]?'✓':w.id}</button>`}function renderNavigation(){document.getElementById('cycleRail').innerHTML=workouts.map(w=>navButton(w,'rail-slot')).join('');document.getElementById('sideCycle').innerHTML=workouts.map(w=>navButton(w,'side-slot')).join('');document.getElementById('topSession').textContent=current+' of 12';document.getElementById('cycleGrid').innerHTML=workouts.map(w=>`<button class="cycle-card ${state.done[w.id]?'done':''}" onclick="openWorkout(${w.id})"><small>Session ${w.id} · ${w.intensity}</small><div class="intensity-line ${w.intensity}"></div><h3>${w.name}</h3><p>${w.focus}</p></button>`).join('')}function e1rm(e,s){let load=+s.kg+(e[3]===2?+state.bw:0),value=+s.reps<=1?load:load*(1+s.reps/30);return e[3]===2?value-state.bw:value}function setRow(i,j,s){let e=workout().ex[i],estimate=e[3]&&s.kg&&s.reps?Math.round(e1rm(e,s))+' e1':'';return`<div class="set-row"><span class="set-number">${j+1}</span><input class="field" type="number" step=".5" value="${s.kg}" placeholder="kg" oninput="editSet(${i},${j},'kg',this.value)"><input class="field" type="number" value="${s.reps}" placeholder="reps" oninput="editSet(${i},${j},'reps',this.value)"><input class="field rpe-field" type="number" step=".5" value="${s.rpe}" placeholder="RPE" oninput="editSet(${i},${j},'rpe',this.value)"><span class="e1">${estimate}</span><button class="tick ${s.done?'on':''}" onclick="toggleSet(${i},${j})">${s.done?'✓':''}</button><button class="remove" onclick="removeSet(${i},${j})">×</button></div>`}function renderWorkout(){let w=workout();document.getElementById('eyebrow').textContent='Session '+w.id+' · '+w.intensity;document.getElementById('workoutName').textContent=w.name;document.getElementById('workoutFocus').textContent=w.focus;document.getElementById('notes').value=state.notes[current]||'';document.getElementById('exerciseList').innerHTML=w.ex.map((e,i)=>`<article class="exercise"><div class="exercise-head"><div><div class="category">${e[0]}</div><h3>${e[1]}</h3></div><div class="target">${e[2]}</div><button class="add" onclick="addSet(${i})">+</button></div><div class="sets">${draft(i).map((s,j)=>setRow(i,j,s)).join('')}</div></article>`).join('');let panel=document.getElementById('conditioningPanel');if(w.conditioning){panel.style.display='block';document.getElementById('conditioningChoices').innerHTML=w.conditioning.map((c,i)=>`<button class="choice ${state.choice[current]===i?'on':''}" onclick="chooseCondition(${i})">${c}</button>`).join('')}else panel.style.display='none';updateSetProgress();renderNavigation()}function addSet(i){draft(i).push({kg:'',reps:'',rpe:'',done:false});save();renderWorkout()}function removeSet(i,j){draft(i).splice(j,1);if(!draft(i).length)draft(i).push({kg:'',reps:'',rpe:'',done:false});save();renderWorkout()}function editSet(i,j,key,value){draft(i)[j][key]=value;localStorage.setItem(KEY,JSON.stringify(state));if(key!=='rpe')renderWorkout()}function toggleSet(i,j){draft(i)[j].done=!draft(i)[j].done;save();renderWorkout()}function chooseCondition(i){state.choice[current]=i;save();renderWorkout()}function updateSetProgress(){let all=workout().ex.flatMap((_,i)=>draft(i)),done=all.filter(s=>s.done).length;document.getElementById('setProgress').style.width=(all.length?done/all.length*100:0)+'%'}function saveSession(){let w=workout(),sets=[];w.ex.forEach((e,i)=>draft(i).forEach(s=>{if(s.kg!==''&&s.reps!=='')sets.push({exercise:e[1],category:e[0],compound:!!e[3],mode:e[3],kg:+s.kg,reps:+s.reps,rpe:s.rpe===''?null:+s.rpe,e1:e1rm(e,s)})}));if(!sets.length&&!confirm('Save without logged sets?'))return;state.history.push({id:Date.now(),date:new Date().toISOString(),session:current,name:w.name,notes:state.notes[current]||'',conditioning:w.conditioning?.[state.choice[current]]||'',sets});state.done[current]=true;Object.keys(state.draft).filter(k=>k.startsWith(current+'-')).forEach(k=>delete state.draft[k]);current=current%12+1;save();renderWorkout()}function compoundNames(){return[...new Set(state.history.flatMap(h=>h.sets.filter(s=>s.compound).map(s=>s.exercise)))]}function renderHistory(){document.getElementById('bodyweight').value=state.bw;document.getElementById('loggedSessions').textContent=state.history.length;let lifts=compoundNames(),select=document.getElementById('liftSelect'),old=select.value;select.innerHTML=lifts.length?lifts.map(l=>`<option>${l}</option>`).join(''):'<option>No compound data</option>';if(lifts.includes(old))select.value=old;let lift=select.value,points=[];state.history.forEach(h=>{let sets=h.sets.filter(s=>s.exercise===lift);if(sets.length){let best=[...sets].sort((a,b)=>b.e1-a.e1)[0];points.push({date:h.date,...best})}});let values=points.map(p=>p.e1),best=values.length?Math.max(...values):null,latest=values.at(-1),first=values[0];document.getElementById('bestE1').textContent=best?Math.round(best)+' kg':'—';document.getElementById('latestE1').textContent=latest?Math.round(latest)+' kg':'—';document.getElementById('changeE1').textContent=latest?(latest-first>=0?'+':'')+Math.round(latest-first)+' kg':'—';drawChart(points);document.getElementById('historyList').innerHTML=points.length?[...points].reverse().map(p=>`<div class="history-row"><span class="date">${new Date(p.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'})}</span><span>${p.kg} kg × ${p.reps}</span><span class="value">${Math.round(p.e1)} kg</span><span class="rpe-col">${p.rpe?'RPE '+p.rpe:''}</span></div>`).join(''):'<div class="empty">Log compound sets to build your strength history.</div>'}function drawChart(points){let el=document.getElementById('chart');if(!points.length){el.innerHTML='<div class="empty">No data yet</div>';return}let values=points.map(p=>p.e1),min=Math.min(...values)-3,max=Math.max(...values)+3,xy=values.map((v,i)=>[24+i/Math.max(1,values.length-1)*552,226-(v-min)/(max-min)*194]),path=xy.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');el.innerHTML=`<svg viewBox="0 0 600 250" preserveAspectRatio="none"><line x1="24" y1="226" x2="576" y2="226" stroke="#27313a"/><path d="${path}" fill="none" stroke="#baff69" stroke-width="3" vector-effect="non-scaling-stroke"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#baff69"><title>${Math.round(values[i])} kg</title></circle>`).join('')}</svg>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cycle-training-data.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('prev').onclick=()=>openWorkout((current+10)%12+1);document.getElementById('next').onclick=()=>openWorkout(current%12+1);document.getElementById('saveWorkout').onclick=saveSession;document.getElementById('notes').oninput=e=>{state.notes[current]=e.target.value;localStorage.setItem(KEY,JSON.stringify(state))};document.getElementById('resetCycle').onclick=()=>{if(confirm('Reset cycle progress? Saved history remains.')){state.done={};state.draft={};state.notes={};state.choice={};current=1;save();renderWorkout()}};document.getElementById('liftSelect').onchange=renderHistory;document.getElementById('bodyweight').onchange=e=>{state.bw=+e.target.value;save();renderHistory()};document.getElementById('exportData').onclick=document.getElementById('exportTop').onclick=exportData;document.getElementById('importData').onchange=e=>{let file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{state=Object.assign(blank(),JSON.parse(reader.result));current=state.cur||1;save();renderWorkout();renderHistory()}catch{alert('Invalid backup file.')}};if(file)reader.readAsText(file)};renderNavigation();renderWorkout();
</script>
